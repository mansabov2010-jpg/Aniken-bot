<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniREM Guruh va Kontaktlar</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --panel: rgba(15, 23, 42, 0.58);
      --incoming: rgba(24, 33, 52, 0.80);
      --outgoing: rgba(2, 132, 199, 0.86);
      --quote: rgba(15, 23, 42, 0.55);
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --line: rgba(226, 232, 240, 0.24);
    }
    * { box-sizing: border-box; font-family: Inter, system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(10, 15, 28, 0.16), rgba(10, 15, 28, 0.38)),
        url("bg-girl.jpg") center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 6px;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px;
      backdrop-filter: blur(4px);
    }
    .tab-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 7px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .tab-btn.active {
      background: rgba(56, 189, 248, 0.34);
      border-color: var(--accent);
    }
    .items-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px;
      min-height: 34px;
      align-items: center;
    }
    .item-chip {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }
    .item-chip.active {
      background: rgba(2, 132, 199, 0.88);
      border-color: #7dd3fc;
    }
    .topbar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 6px 8px;
      display: flex;
      gap: 6px;
      align-items: center;
      backdrop-filter: blur(4px);
    }
    .chat-select {
      flex: 1;
      background: rgba(15, 23, 42, 0.76);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .small-btn {
      background: rgba(30, 41, 59, 0.85);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 11.5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .custom-bar {
      display: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 6px 8px;
      gap: 5px;
      flex-wrap: wrap;
    }
    .custom-bar.active { display: flex; }
    .custom-bar input {
      flex: 1;
      min-width: 105px;
      background: rgba(15, 23, 42, 0.80);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 11.5px;
    }
    .header-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 7px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .header-title {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-sub {
      font-size: 10px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 1px;
      line-height: 1.25;
    }
    .header-sub a {
      color: #7dd3fc;
      text-decoration: none;
      word-break: break-all;
    }
    .jump-banner {
      display: none;
      background: rgba(2, 132, 199, 0.9);
      border: 1px solid #bae6fd;
      color: #fff;
      border-radius: 9px;
      padding: 5px 9px;
      font-size: 11.5px;
      font-weight: 600;
      justify-content: space-between;
      align-items: center;
    }
    .jump-banner.active { display: flex; }
    .messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 2px;
    }
    .msg-row { display: flex; width: 100%; }
    .msg-row.incoming { justify-content: flex-start; }
    .msg-row.outgoing { justify-content: flex-end; }
    .msg-card {
      width: 82%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 7px 10px;
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .msg-row.incoming .msg-card { background: var(--incoming); }
    .msg-row.outgoing .msg-card { background: var(--outgoing); }
    .msg-card.highlighted {
      border-color: #fde047;
      box-shadow: 0 0 0 2px rgba(253, 224, 71, 0.75);
    }
    .msg-head {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
    }
    .msg-time { font-size: 10px; opacity: 0.85; font-weight: 400; }
    .reply-box {
      background: var(--quote);
      border-left: 3px solid #fff;
      border-radius: 7px;
      padding: 4px 7px;
      font-size: 11px;
      cursor: pointer;
    }
    .sticker-view {
      font-size: 38px;
      line-height: 1.1;
      padding: 2px 0;
    }
    .msg-body { font-size: 13px; line-height: 1.32; word-break: break-word; }
    .voice-box {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 9px;
      padding: 5px 7px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
    }
    .voice-box audio { width: 100%; height: 28px; }
    .msg-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      margin-top: 2px;
    }
    .chip {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: var(--text);
      border-radius: 7px;
      padding: 2px 7px;
      font-size: 10.5px;
      cursor: pointer;
    }
    .chip.del {
      background: rgba(190, 24, 93, 0.65);
      border-color: rgba(251, 113, 133, 0.55);
    }
    .react-badge {
      font-size: 12px;
      padding: 1px 6px;
      border-radius: 7px;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }
    .composer {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      backdrop-filter: blur(5px);
    }
    .reply-preview, .voice-panel {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: var(--quote);
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 10px;
      padding: 7px;
      font-size: 11.5px;
    }
    .reply-preview {
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
    }
    .reply-preview.active, .voice-panel.active { display: flex; }
    .voice-panel { border-left-color: #ef4444; }
    .voice-controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .media-tools, .emoji-row {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 1px;
    }
    .emoji-btn {
      background: rgba(30, 41, 59, 0.82);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 3px 7px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn {
      background: rgba(30, 41, 59, 0.88);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn.primary { background: #0284c7; border-color: #7dd3fc; color: #fff; }
    .btn.danger { background: #dc2626; border-color: #fca5a5; color: #fff; }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .input-row { display: flex; gap: 6px; }
    .input-row input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 13px;
    }
    .sub-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button id="tabGroups" class="tab-btn active" onclick="switchTab('groups')">👥 Guruhlar</button>
    <button id="tabContacts" class="tab-btn" onclick="switchTab('contacts')">👤 Kontaktlar</button>
  </div>

  <div id="itemsBar" class="items-bar"></div>

  <div class="topbar">
    <select id="itemSelector" class="chat-select" onchange="switchItemDropdown()"></select>
    <button class="small-btn" onclick="toggleCustomBar()">+ Qo'shish</button>
  </div>

  <div id="customBar" class="custom-bar">
    <input id="customNameInput" type="text" placeholder="Nomi..." />
    <input id="customIdInput" type="text" placeholder="ID yoki @username..." />
    <input id="customLinkInput" type="text" placeholder="Havola (ixtiyoriy)..." />
    <button class="small-btn" onclick="addCustomItem()">Saqlash</button>
  </div>

  <div class="header-card" onclick="openActiveLink()">
    <div class="header-title">
      <span id="activeName">Tanlanmagan</span>
      <span id="activeTypeLabel" style="font-size:10.5px;color:#7dd3fc;">-</span>
    </div>
    <div class="header-sub">
      <span>ID: <code id="activeId">-</code></span>
      <span>Havola: <a id="activeLink" href="#" target="_blank" onclick="event.stopPropagation()">-</a></span>
    </div>
  </div>

  <div id="jumpBanner" class="jump-banner">
    <span id="jumpBannerText">Mana shu xabarga reply qilingan</span>
    <button class="chip" onclick="hideJumpBanner()">✕</button>
  </div>

  <div id="messagesList" class="messages"></div>

  <div class="composer">
    <div id="replyBar" class="reply-preview">
      <span id="replyText">Reply...</span>
      <button class="chip" onclick="clearReply()">✕</button>
    </div>

    <div id="voicePanel" class="voice-panel">
      <div id="voiceStatusText">🎙 Ovozli xabar yozishga tayyor</div>
      <audio id="voicePreviewAudio" controls style="display:none;width:100%;height:28px;"></audio>
      <div class="voice-controls">
        <button id="startRecBtn" class="btn danger" onclick="startRecording()">🎙 Yozishni boshlash</button>
        <button id="stopRecBtn" class="btn" onclick="stopRecording()" style="display:none;">⏹ To'xtatish</button>
        <button id="sendVoiceBtn" class="btn primary" onclick="sendRecordedVoice()" style="display:none;">📤 Jo'natish</button>
        <button class="btn" onclick="discardVoice()">✕ Bekor</button>
      </div>
    </div>

    <div class="media-tools">
      <button class="chip" onclick="sendStickerItem('🧸')">🧸 Stiker</button>
      <button class="chip" onclick="sendStickerItem('🔥')">🔥 Stiker</button>
      <button class="chip" onclick="sendStickerItem('😂')">😂 Stiker</button>
      <button class="chip" onclick="openVoicePanel()">🎙 Ovozli xabar</button>
    </div>

    <div class="emoji-row">
      <button class="emoji-btn" onclick="addEmoji('😀')">😀</button>
      <button class="emoji-btn" onclick="addEmoji('😋')">😋</button>
      <button class="emoji-btn" onclick="addEmoji('😜')">😜</button>
      <button class="emoji-btn" onclick="addEmoji('😂')">😂</button>
      <button class="emoji-btn" onclick="addEmoji('🔥')">🔥</button>
      <button class="emoji-btn" onclick="addEmoji('❤️')">❤️</button>
      <button class="emoji-btn" onclick="addEmoji('👍')">👍</button>
      <button class="emoji-btn" onclick="addEmoji('⚡')">⚡</button>
      <button class="emoji-btn" onclick="addEmoji('💎')">💎</button>
      <button class="emoji-btn" onclick="addEmoji('👑')">👑</button>
    </div>

    <div class="input-row">
      <input id="msgInput" type="text" placeholder="Bot nomidan xabar yozing..." />
      <button id="submitBtn" class="btn primary" onclick="submitTextOrEdit()">Jo'natish</button>
    </div>

    <div class="sub-row">
      <span id="sendStatusLabel">Yozuvchi: <b>Bot</b></span>
      <span id="editingBadge" style="color:#7dd3fc;"></span>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let currentTab = localStorage.getItem("anirem_tab_v5") || "groups";
    let apiBaseUrl = localStorage.getItem("anirem_api_base_v5") || "";
    let replyTarget = null;
    let editingMsgId = null;
    let isSubmitting = false;

    let mediaRecorder = null;
    let audioChunks = [];
    let recTimer = null;
    let recSec = 0;
    let recordedAudioUrl = "";
    let recordedDuration = "0:00";

    // Matnni xavfsiz ko'rsatish (HTML belgilar xato chiqarmasligi uchun)
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function setSendStatus(txt, isErr = false) {
      const el = document.getElementById("sendStatusLabel");
      if (!el) return;
      el.innerHTML = isErr
        ? `<span style="color:#fca5a5;">${esc(txt)}</span>`
        : `<span>${esc(txt)}</span>`;
    }

    // ───────────────────────────────────────────────
    //  Telegram'ga yuborish (bot serveri orqali)
    //  Muvaffaqiyatli bo'lsa javob obyektini, aks holda null qaytaradi
    // ───────────────────────────────────────────────
    async function dispatchToTelegram(payloadObj) {
      if (!apiBaseUrl) {
        setSendStatus("⚠️ API manzili yo'q. Botda BACKEND_API_URL ni o'rnating va mini ilovani qayta oching", true);
        return null;
      }
      if (!tg || !tg.initData) {
        setSendStatus("⚠️ Mini ilovani Telegram ichidagi tugma orqali oching", true);
        return null;
      }
      setSendStatus("⏳ Yuborilmoqda...", false);
      try {
        const resp = await fetch(`${apiBaseUrl.replace(/\/+$/, "")}/api/send`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ...payloadObj, init_data: tg.initData }),
        });
        let data = {};
        try { data = await resp.json(); } catch (_) {}
        if (resp.ok && data.ok) {
          setSendStatus("✅ Telegram'ga yuborildi", false);
          return data;
        }
        setSendStatus("⚠️ " + (data.error || data.message || ("Server xatosi: " + resp.status)), true);
      } catch (e) {
        setSendStatus("⚠️ Serverga ulanib bo'lmadi (Render uyg'onyapti bo'lishi mumkin, qayta urining)", true);
      }
      return null;
    }

    function loadList(tab) {
      return JSON.parse(localStorage.getItem("anirem_list_v5_" + tab) || "[]");
    }

    function saveList(tab, arr) {
      localStorage.setItem("anirem_list_v5_" + tab, JSON.stringify(arr));
    }

    function ingestPayload(data) {
      if (!data || typeof data !== "object") return;
      if (data.api_base) {
        apiBaseUrl = String(data.api_base).trim();
        localStorage.setItem("anirem_api_base_v5", apiBaseUrl);
      }
      if (Array.isArray(data.groups)) {
        const cur = loadList("groups");
        data.groups.forEach(g => {
          if (g && g.id && !cur.some(x => String(x.id) === String(g.id))) {
            cur.push({ id: String(g.id), name: g.name || String(g.id), link: g.link || "" });
          }
        });
        saveList("groups", cur);
      }
      if (Array.isArray(data.contacts)) {
        const cur = loadList("contacts");
        data.contacts.forEach(u => {
          if (u && u.id && !cur.some(x => String(x.id) === String(u.id))) {
            cur.push({ id: String(u.id), name: u.name || String(u.id), link: u.link || "" });
          }
        });
        saveList("contacts", cur);
      }
      if (data.incoming_message && data.incoming_message.chat_id) {
        const m = data.incoming_message;
        const targetTab = m.tab === "groups" ? "groups" : "contacts";
        const key = "anirem_msgs_v5_" + targetTab + "_" + String(m.chat_id);
        const list = JSON.parse(localStorage.getItem(key) || "[]");
        if (!list.some(x => String(x.id) === String(m.id))) {
          list.push({
            id: m.id || Date.now(),
            direction: "incoming",
            sender: m.sender || "Obunachi",
            time: m.time || nowTime(),
            type: m.type || "text",
            text: m.text || "",
            sticker: m.sticker || "",
            audioUrl: m.audioUrl || "",
            duration: m.duration || "",
            replyTo: m.replyTo || null,
            reaction: ""
          });
          localStorage.setItem(key, JSON.stringify(list));
        }
      }
    }

    function initFromUrl() {
      try {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get("data");
        if (raw) {
          ingestPayload(JSON.parse(decodeURIComponent(raw)));
        }
      } catch (_) {}
    }

    function buildLink(item) {
      if (!item || !item.id) return "";
      if (item.link) return item.link;
      const sid = String(item.id).trim();
      if (sid.startsWith("@")) return "https://t.me/" + sid.slice(1);
      if (/^-100\d+$/.test(sid)) return "https://t.me/c/" + sid.slice(4);
      if (/^\d+$/.test(sid)) return "https://t.me/user?id=" + sid;
      return "";
    }

    function getActiveItem() {
      const list = loadList(currentTab);
      const savedId = localStorage.getItem("anirem_active_v5_" + currentTab);
      return list.find(x => String(x.id) === String(savedId)) || list[0] || null;
    }

    function selectItem(id) {
      localStorage.setItem("anirem_active_v5_" + currentTab, String(id));
      clearReply();
      cancelEdit();
      hideJumpBanner();
      renderAll();
    }

    function switchTab(tab) {
      currentTab = tab;
      localStorage.setItem("anirem_tab_v5", tab);
      clearReply();
      cancelEdit();
      hideJumpBanner();
      renderAll();
    }

    function switchItemDropdown() {
      selectItem(document.getElementById("itemSelector").value);
    }

    function toggleCustomBar() {
      document.getElementById("customBar").classList.toggle("active");
    }

    function addCustomItem() {
      const cname = document.getElementById("customNameInput").value.trim();
      const cid = document.getElementById("customIdInput").value.trim();
      const clink = document.getElementById("customLinkInput").value.trim();
      if (!cid) return;
      const list = loadList(currentTab);
      if (!list.some(x => String(x.id) === cid)) {
        list.push({ id: cid, name: cname || cid, link: clink || "" });
        saveList(currentTab, list);
      }
      localStorage.setItem("anirem_active_v5_" + currentTab, cid);
      document.getElementById("customNameInput").value = "";
      document.getElementById("customIdInput").value = "";
      document.getElementById("customLinkInput").value = "";
      document.getElementById("customBar").classList.remove("active");
      renderAll();
    }

    function openActiveLink() {
      const active = getActiveItem();
      const link = buildLink(active);
      if (!link) return;
      if (tg && tg.openTelegramLink && link.startsWith("https://t.me/")) {
        tg.openTelegramLink(link);
      } else {
        window.open(link, "_blank");
      }
    }

    function renderAll() {
      document.getElementById("tabGroups").classList.toggle("active", currentTab === "groups");
      document.getElementById("tabContacts").classList.toggle("active", currentTab === "contacts");

      const list = loadList(currentTab);
      const active = getActiveItem();
      const bar = document.getElementById("itemsBar");
      const sel = document.getElementById("itemSelector");

      if (!list.length) {
        bar.innerHTML = `<span style="font-size:11px;color:#cbd5e1;">${currentTab === "groups" ? "Bot qo'shilgan guruhlar hali yo'q" : "Botga yozgan insonlar hali yo'q"}</span>`;
        sel.innerHTML = `<option value="">Ro'yxat bo'sh</option>`;
        document.getElementById("activeName").textContent = "Ro'yxat bo'sh";
        document.getElementById("activeTypeLabel").textContent = currentTab === "groups" ? "Guruhlar" : "Kontaktlar";
        document.getElementById("activeId").textContent = "-";
        document.getElementById("activeLink").textContent = "-";
        document.getElementById("activeLink").href = "#";
        document.getElementById("messagesList").innerHTML = "";
        return;
      }

      bar.innerHTML = list.map(item => `
        <button class="item-chip ${active && String(active.id) === String(item.id) ? "active" : ""}" onclick="selectItem('${String(item.id).replace(/'/g, "\\'")}')">
          ${esc(item.name)}
        </button>
      `).join("");

      sel.innerHTML = list.map(item => `<option value="${esc(item.id)}">${esc(item.name)}</option>`).join("");
      if (active) sel.value = active.id;

      if (active) {
        const link = buildLink(active);
        document.getElementById("activeName").textContent = active.name;
        document.getElementById("activeTypeLabel").textContent = currentTab === "groups" ? "Guruh" : "Kontakt";
        document.getElementById("activeId").textContent = active.id;
        const a = document.getElementById("activeLink");
        a.textContent = link || "-";
        a.href = link || "#";
      }

      renderMessages(active);
    }

    function msgsKey(active) {
      return "anirem_msgs_v5_" + currentTab + "_" + (active ? active.id : "none");
    }

    function dedupeById(list) {
      const seen = new Set();
      return list.filter(item => {
        const key = String(item.id);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function nowTime() {
      return new Date().toTimeString().slice(0, 8);
    }

    function fmtDur(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    function hideJumpBanner() {
      document.getElementById("jumpBanner").classList.remove("active");
    }

    function jumpToMessage(targetId) {
      const el = document.getElementById("msg-row-" + targetId);
      if (!el) return;
      document.querySelectorAll(".msg-card.highlighted").forEach(n => n.classList.remove("highlighted"));
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      const card = el.querySelector(".msg-card");
      if (card) card.classList.add("highlighted");
      document.getElementById("jumpBannerText").textContent = `Mana shu xabarga reply qilingan (#${targetId})`;
      document.getElementById("jumpBanner").classList.add("active");
      setTimeout(() => { if (card) card.classList.remove("highlighted"); }, 2500);
    }

    function renderMessages(active) {
      const box = document.getElementById("messagesList");
      if (!active) {
        box.innerHTML = "";
        return;
      }
      const list = dedupeById(JSON.parse(localStorage.getItem(msgsKey(active)) || "[]"));
      localStorage.setItem(msgsKey(active), JSON.stringify(list));

      box.innerHTML = list.map(m => {
        const dir = m.direction === "incoming" ? "incoming" : "outgoing";
        const sender = m.direction === "incoming" ? (m.sender || active.name) : "Bot";
        const hasReply = m.replyTo && (m.replyTo.text || m.replyTo.id);

        let bodyHtml = "";
        if (m.type === "sticker") {
          bodyHtml = `<div class="sticker-view">${esc(m.sticker || "🧸")}</div>`;
        } else if (m.type === "voice") {
          bodyHtml = `
            <div class="voice-box">
              <span>🎙 Ovozli xabar (${esc(m.duration || "0:00")})</span>
              ${m.audioUrl ? `<audio controls src="${m.audioUrl}"></audio>` : ""}
            </div>
          `;
        }
        if (m.text) {
          bodyHtml += `<div class="msg-body">${esc(m.text)}</div>`;
        }

        return `
          <div id="msg-row-${m.id}" class="msg-row ${dir}">
            <div class="msg-card">
              <div class="msg-head">
                <span>${esc(sender)}</span>
                <span class="msg-time">${esc(m.time || "")} • #${m.id}</span>
              </div>
              ${hasReply ? `
                <div class="reply-box" onclick="jumpToMessage(${Number(m.replyTo.id) || 0})">
                  <b>↩️ ${esc(m.replyTo.sender || "Xabar")} ${m.replyTo.id ? "#" + m.replyTo.id : ""}</b><br/>
                  <span>${esc(m.replyTo.text || "")}</span>
                </div>
              ` : ""}
              ${bodyHtml}
              <div class="msg-actions">
                ${m.reaction ? `<span class="react-badge">${m.reaction}</span>` : ""}
                <button class="chip" onclick="startReply(${m.id})">Reply</button>
                <button class="chip" onclick="reactMsg(${m.id}, '❤️')">❤️</button>
                <button class="chip" onclick="reactMsg(${m.id}, '👍')">👍</button>
                <button class="chip" onclick="reactMsg(${m.id}, '😂')">😂</button>
                <button class="chip" onclick="startEdit(${m.id})">Tahrirlash</button>
                <button class="chip del" onclick="deleteMsg(${m.id})">O'chirish</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
      box.scrollTop = box.scrollHeight;
    }

    function addEmoji(em) {
      const inp = document.getElementById("msgInput");
      inp.value += em;
      inp.focus();
    }

    function startReply(id) {
      const active = getActiveItem();
      if (!active) return;
      const list = JSON.parse(localStorage.getItem(msgsKey(active)) || "[]");
      const found = list.find(x => String(x.id) === String(id));
      if (!found) return;
      const previewText = found.text || found.sticker || (found.type === "voice" ? `Ovozli xabar (${found.duration || "0:00"})` : "Xabar");
      const author = found.direction === "incoming" ? (found.sender || active.name) : "Bot";
      replyTarget = { id: found.id, sender: author, text: previewText };
      document.getElementById("replyText").textContent = `↩️ #${found.id} (${author}): ${previewText}`;
      document.getElementById("replyBar").classList.add("active");
    }

    function clearReply() {
      replyTarget = null;
      document.getElementById("replyBar").classList.remove("active");
    }

    function startEdit(id) {
      const active = getActiveItem();
      if (!active) return;
      const list = JSON.parse(localStorage.getItem(msgsKey(active)) || "[]");
      const found = list.find(x => String(x.id) === String(id));
      if (!found) return;
      if (found.direction === "incoming") {
        setSendStatus("⚠️ Faqat bot yuborgan xabarni tahrirlash mumkin", true);
        return;
      }
      if (found.type === "voice") {
        setSendStatus("⚠️ Ovozli xabarni tahrirlab bo'lmaydi", true);
        return;
      }
      editingMsgId = found.id;
      document.getElementById("msgInput").value = found.text || found.sticker || "";
      document.getElementById("submitBtn").textContent = "Saqlash";
      document.getElementById("editingBadge").textContent = `Tahrir: #${found.id}`;
    }

    function cancelEdit() {
      editingMsgId = null;
      document.getElementById("submitBtn").textContent = "Jo'natish";
      document.getElementById("editingBadge").textContent = "";
    }

    async function reactMsg(id, emoji) {
      const active = getActiveItem();
      if (!active) return;
      const key = msgsKey(active);
      const list = JSON.parse(localStorage.getItem(key) || "[]");
      const item = list.find(x => String(x.id) === String(id));
      if (!item) return;
      const newReaction = item.reaction === emoji ? "" : emoji;
      const data = await dispatchToTelegram({
        action: "react_msg",
        target_id: active.id,
        message_id: id,
        emoji: newReaction || emoji
      });
      if (!data) return;
      item.reaction = newReaction;
      localStorage.setItem(key, JSON.stringify(list));
      renderMessages(active);
    }

    async function deleteMsg(id) {
      const active = getActiveItem();
      if (!active) return;
      const data = await dispatchToTelegram({
        action: "delete_sent_msg",
        target_id: active.id,
        message_id: id
      });
      if (!data) return;
      const key = msgsKey(active);
      const list = JSON.parse(localStorage.getItem(key) || "[]").filter(x => String(x.id) !== String(id));
      localStorage.setItem(key, JSON.stringify(list));
      renderMessages(active);
    }

    // Avval Telegram'ga yuboradi. Faqat muvaffaqiyatli bo'lsa chatga haqiqiy Telegram ID bilan qo'shadi.
    async function pushOutMsg(payloadObj) {
      const active = getActiveItem();
      if (!active) return false;
      const rt = replyTarget;
      const isVoice = payloadObj.type === "voice";

      const body = isVoice
        ? { action: "send_voice_data", target_id: active.id, audio_base64: payloadObj.audioUrl }
        : { action: "send_direct", target_id: active.id, text: payloadObj.text || payloadObj.sticker };
      if (rt && rt.id) body.reply_to = rt.id;

      const data = await dispatchToTelegram(body);
      if (!data || !data.tg_message_id) return false;

      const key = msgsKey(active);
      const list = JSON.parse(localStorage.getItem(key) || "[]");
      list.push({
        id: data.tg_message_id,
        direction: "outgoing",
        sender: "Bot",
        time: nowTime(),
        replyTo: rt ? { id: rt.id, sender: rt.sender, text: rt.text } : null,
        reaction: "",
        ...payloadObj
      });
      localStorage.setItem(key, JSON.stringify(dedupeById(list)));
      renderMessages(active);
      return true;
    }

    async function sendStickerItem(stickerChar) {
      if (isSubmitting) return;
      isSubmitting = true;
      const ok = await pushOutMsg({ type: "sticker", sticker: stickerChar, text: "" });
      if (ok) clearReply();
      isSubmitting = false;
    }

    function openVoicePanel() {
      document.getElementById("voicePanel").classList.add("active");
    }

    function discardVoice() {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
      clearInterval(recTimer);
      recordedAudioUrl = "";
      recordedDuration = "0:00";
      document.getElementById("voicePreviewAudio").style.display = "none";
      document.getElementById("voicePreviewAudio").src = "";
      document.getElementById("sendVoiceBtn").style.display = "none";
      document.getElementById("stopRecBtn").style.display = "none";
      document.getElementById("startRecBtn").style.display = "inline-block";
      document.getElementById("voiceStatusText").textContent = "🎙 Ovozli xabar yozishga tayyor";
      document.getElementById("voicePanel").classList.remove("active");
    }

    async function startRecording() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
        document.getElementById("voiceStatusText").textContent = "⚠️ Qurilmada mikrofon yoki MediaRecorder topilmadi.";
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        recSec = 0;
        recordedAudioUrl = "";
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = e => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          clearInterval(recTimer);
          recordedDuration = fmtDur(Math.max(1, recSec));
          const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
          const reader = new FileReader();
          reader.onloadend = () => {
            recordedAudioUrl = typeof reader.result === "string" ? reader.result : "";
            const audioEl = document.getElementById("voicePreviewAudio");
            audioEl.src = recordedAudioUrl;
            audioEl.style.display = "block";
            document.getElementById("voiceStatusText").textContent = `✅ Yozib olindi (${recordedDuration}). Eshitib ko'ring yoki Jo'nating:`;
            document.getElementById("stopRecBtn").style.display = "none";
            document.getElementById("startRecBtn").style.display = "inline-block";
            document.getElementById("sendVoiceBtn").style.display = "inline-block";
          };
          reader.readAsDataURL(blob);
        };

        mediaRecorder.start();
        document.getElementById("voicePreviewAudio").style.display = "none";
        document.getElementById("sendVoiceBtn").style.display = "none";
        document.getElementById("startRecBtn").style.display = "none";
        document.getElementById("stopRecBtn").style.display = "inline-block";
        document.getElementById("voiceStatusText").textContent = "🔴 Yozilmoqda... 0:00";

        recTimer = setInterval(() => {
          recSec += 1;
          document.getElementById("voiceStatusText").textContent = `🔴 Yozilmoqda... ${fmtDur(recSec)}`;
        }, 1000);
      } catch (_) {
        document.getElementById("voiceStatusText").textContent = "❌ Mikrofonga ruxsat berilmadi.";
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
    }

    async function sendRecordedVoice() {
      const active = getActiveItem();
      if (!active || !recordedAudioUrl || isSubmitting) return;
      isSubmitting = true;
      const btn = document.getElementById("sendVoiceBtn");
      btn.disabled = true;

      const ok = await pushOutMsg({
        type: "voice",
        duration: recordedDuration,
        audioUrl: recordedAudioUrl,
        text: ""
      });

      btn.disabled = false;
      isSubmitting = false;
      if (ok) {
        clearReply();
        discardVoice();
      }
    }

    async function submitTextOrEdit() {
      if (isSubmitting) return;
      const inp = document.getElementById("msgInput");
      const text = inp.value.trim();
      if (!text) return;

      const active = getActiveItem();
      if (!active) return;
      isSubmitting = true;
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;

      if (editingMsgId !== null) {
        const data = await dispatchToTelegram({
          action: "edit_sent_msg",
          target_id: active.id,
          message_id: editingMsgId,
          text
        });
        if (data) {
          const key = msgsKey(active);
          const list = JSON.parse(localStorage.getItem(key) || "[]");
          const item = list.find(x => String(x.id) === String(editingMsgId));
          if (item) {
            if (item.type === "sticker") {
              item.sticker = text;
            } else {
              item.text = text;
            }
            localStorage.setItem(key, JSON.stringify(list));
            renderMessages(active);
          }
          inp.value = "";
          cancelEdit();
        }
      } else {
        const ok = await pushOutMsg({ type: "text", text });
        if (ok) {
          inp.value = "";
          clearReply();
        }
      }

      submitBtn.disabled = false;
      isSubmitting = false;
    }

    document.getElementById("msgInput").addEventListener("keydown", e => {
      if (e.key === "Enter") submitTextOrEdit();
    });

    initFromUrl();
    renderAll();
  </script>
</body>
