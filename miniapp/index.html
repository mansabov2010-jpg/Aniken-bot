<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniREM Chat Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --panel: rgba(15, 23, 42, 0.56);
      --incoming: rgba(24, 33, 52, 0.78);
      --outgoing: rgba(2, 132, 199, 0.84);
      --quote: rgba(15, 23, 42, 0.52);
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #e2e8f0;
      --line: rgba(226, 232, 240, 0.24);
    }
    * { box-sizing: border-box; font-family: Inter, system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(10, 15, 28, 0.16), rgba(10, 15, 28, 0.38)),
        url("bg-girl.jpg") center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 6px;
    }
    .cat-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 4px;
      backdrop-filter: blur(4px);
    }
    .cat-tab {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 6px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .cat-tab.active {
      background: rgba(56, 189, 248, 0.32);
      border-color: var(--accent);
    }
    .chat-chips-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 3px 2px;
      min-height: 34px;
      align-items: center;
    }
    .chat-chip {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }
    .chat-chip.active {
      background: rgba(2, 132, 199, 0.85);
      border-color: #7dd3fc;
    }
    .topbar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 6px 8px;
      display: flex;
      gap: 6px;
      align-items: center;
      backdrop-filter: blur(4px);
    }
    .chat-select {
      flex: 1;
      background: rgba(15, 23, 42, 0.75);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .small-btn {
      background: rgba(30, 41, 59, 0.85);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 11.5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .custom-bar {
      display: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 6px 8px;
      gap: 5px;
      flex-wrap: wrap;
    }
    .custom-bar.active { display: flex; }
    .custom-bar input {
      flex: 1;
      min-width: 105px;
      background: rgba(15, 23, 42, 0.78);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 11.5px;
    }
    .chat-profile-box {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 6px 9px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .chat-profile-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 12px;
    }
    .chat-meta-line {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
    }
    .chat-meta-line a {
      color: #7dd3fc;
      text-decoration: none;
      word-break: break-all;
    }
    .jump-banner {
      display: none;
      background: rgba(2, 132, 199, 0.9);
      border: 1px solid #bae6fd;
      color: #fff;
      border-radius: 9px;
      padding: 5px 9px;
      font-size: 11.5px;
      font-weight: 600;
      justify-content: space-between;
      align-items: center;
    }
    .jump-banner.active { display: flex; }
    .messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 2px;
    }
    .msg-row {
      display: flex;
      width: 100%;
    }
    .msg-row.outgoing { justify-content: flex-end; }
    .msg-row.incoming { justify-content: flex-start; }
    .msg-card {
      width: 82%;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 7px 10px;
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .msg-row.incoming .msg-card { background: var(--incoming); }
    .msg-row.outgoing .msg-card { background: var(--outgoing); }
    .msg-card.highlighted {
      border-color: #fde047;
      box-shadow: 0 0 0 2px rgba(253, 224, 71, 0.75);
    }
    .msg-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
    }
    .msg-time { font-size: 10px; opacity: 0.85; font-weight: 400; }
    .reply-box {
      background: var(--quote);
      border-left: 3px solid #fff;
      border-radius: 7px;
      padding: 4px 7px;
      font-size: 11px;
      cursor: pointer;
    }
    .sticker-view {
      font-size: 38px;
      line-height: 1.1;
      padding: 2px 0;
    }
    .voice-view {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      width: fit-content;
    }
    .msg-body { font-size: 13.5px; line-height: 1.32; word-break: break-word; }
    .msg-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      margin-top: 2px;
    }
    .chip {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: var(--text);
      border-radius: 7px;
      padding: 2px 7px;
      font-size: 10.5px;
      cursor: pointer;
    }
    .chip.del {
      background: rgba(190, 24, 93, 0.65);
      border-color: rgba(251, 113, 133, 0.55);
    }
    .react-badge {
      font-size: 12px;
      padding: 1px 6px;
      border-radius: 7px;
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.35);
    }
    .composer {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      backdrop-filter: blur(5px);
    }
    .reply-preview {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: var(--quote);
      border-left: 3px solid var(--accent);
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 11px;
    }
    .reply-preview.active { display: flex; }
    .media-tools, .emoji-row {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 1px;
    }
    .emoji-btn {
      background: rgba(30, 41, 59, 0.82);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 3px 7px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    .input-row { display: flex; gap: 6px; }
    .input-row input {
      flex: 1;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 13px;
    }
    .send-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 0 13px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
    }
    .sub-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="cat-tabs">
    <button id="tab-groups" class="cat-tab active" onclick="selectCategory('groups')">👥 Guruhlar</button>
    <button id="tab-channels" class="cat-tab" onclick="selectCategory('channels')">📢 Kanallar</button>
    <button id="tab-contacts" class="cat-tab" onclick="selectCategory('contacts')">👤 Kontaktlar</button>
  </div>

  <div id="chatChipsBar" class="chat-chips-bar"></div>

  <div class="topbar">
    <select id="chatSelector" class="chat-select" onchange="switchChat()"></select>
    <button class="small-btn" onclick="toggleCustomBar()">+ Qo'shish</button>
  </div>

  <div id="customBar" class="custom-bar">
    <input id="customNameInput" type="text" placeholder="Chat / Kontakt nomi..." />
    <input id="customIdInput" type="text" placeholder="ID yoki @username..." />
    <input id="customLinkInput" type="text" placeholder="Havola (ixtiyoriy)..." />
    <button class="small-btn" onclick="addCustomChat()">Saqlash</button>
  </div>

  <div id="chatProfileBox" class="chat-profile-box" onclick="openCurrentChatProfile()">
    <div class="chat-profile-top">
      <span id="profileTitle">Chat</span>
      <span>Chatga kirish ↗</span>
    </div>
    <div class="chat-meta-line">
      <span><b>ID:</b> <code id="metaId">-</code></span>
      <span><b>Havola:</b> <a id="metaLink" href="#" target="_blank" onclick="event.stopPropagation()">-</a></span>
    </div>
  </div>

  <div id="jumpBanner" class="jump-banner">
    <span id="jumpBannerText">Mana shu xabarga reply qilingan</span>
    <button class="chip" onclick="hideJumpBanner()">✕</button>
  </div>

  <div id="messagesList" class="messages"></div>

  <div class="composer">
    <div id="replyBar" class="reply-preview">
      <span id="replyText">Reply...</span>
      <button class="chip" onclick="clearReply()">✕</button>
    </div>

    <div class="media-tools">
      <button class="chip" onclick="sendStickerItem('🧸')">🧸 Stiker</button>
      <button class="chip" onclick="sendStickerItem('🔥')">🔥 Stiker</button>
      <button class="chip" onclick="sendStickerItem('😂')">😂 Stiker</button>
      <button class="chip" onclick="sendVoiceItem('0:05')">🎙 Ovozli xabar</button>
    </div>

    <div class="emoji-row">
      <button class="emoji-btn" onclick="addEmoji('😀')">😀</button>
      <button class="emoji-btn" onclick="addEmoji('😋')">😋</button>
      <button class="emoji-btn" onclick="addEmoji('😜')">😜</button>
      <button class="emoji-btn" onclick="addEmoji('😂')">😂</button>
      <button class="emoji-btn" onclick="addEmoji('🔥')">🔥</button>
      <button class="emoji-btn" onclick="addEmoji('❤️')">❤️</button>
      <button class="emoji-btn" onclick="addEmoji('👍')">👍</button>
      <button class="emoji-btn" onclick="addEmoji('⚡')">⚡</button>
      <button class="emoji-btn" onclick="addEmoji('💎')">💎</button>
      <button class="emoji-btn" onclick="addEmoji('👑')">👑</button>
    </div>

    <div class="input-row">
      <input id="msgInput" type="text" placeholder="Bot nomidan xabar yozing..." />
      <button id="submitBtn" class="send-btn" onclick="submitMessage()">Yuborish</button>
    </div>

    <div class="sub-row">
      <span>Yozuvchi: <b>Bot</b></span>
      <span id="editingBadge" style="color:#7dd3fc;"></span>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const DEFAULT_CHATS = {
      groups: [
        { id: "-1002000000001", name: "Anime Muhokama Guruhi", link: "https://t.me/joinchat/group_demo" },
        { id: "-1002000000002", name: "Dublyaj Jamoasi", link: "https://t.me/joinchat/dub_team" }
      ],
      channels: [
        { id: "@AniKinolar_kanal", name: "AniKinolar Asosiy Kanal", link: "https://t.me/AniKinolar_kanal" }
      ],
      contacts: [
        { id: "7986354170", name: "Obunachi #1", link: "https://t.me/Yegerist_mvp" },
        { id: "7637155944", name: "Obunachi #2", link: "https://t.me/AniRembot" }
      ]
    };

    let currentCategory = localStorage.getItem("anirem_cat") || "groups";
    let replyTarget = null;
    let editingMsgId = null;
    let isSubmitting = false;

    function getChats(cat) {
      const saved = JSON.parse(localStorage.getItem("anirem_chats_" + cat) || "null");
      if (Array.isArray(saved) && saved.length) return saved;
      return DEFAULT_CHATS[cat] || [];
    }

    function saveChats(cat, list) {
      localStorage.setItem("anirem_chats_" + cat, JSON.stringify(list));
    }

    function getActiveChatObj() {
      const list = getChats(currentCategory);
      const savedId = localStorage.getItem("anirem_active_id_" + currentCategory);
      return list.find(c => String(c.id) === String(savedId)) || list[0] || { id: "", name: "Chat", link: "" };
    }

    function buildLink(chatObj) {
      if (chatObj.link) return chatObj.link;
      if (String(chatObj.id).startsWith("@")) {
        return "https://t.me/" + String(chatObj.id).slice(1);
      }
      const numId = String(chatObj.id).replace(/^-100/, "");
      return "https://t.me/c/" + numId;
    }

    function openCurrentChatProfile() {
      const active = getActiveChatObj();
      const link = buildLink(active);
      if (link && tg && tg.openTelegramLink && link.startsWith("https://t.me/")) {
        tg.openTelegramLink(link);
      } else if (link && link !== "#") {
        window.open(link, "_blank");
      }
    }

    function renderChatSelector() {
      ["groups", "channels", "contacts"].forEach(cat => {
        document.getElementById("tab-" + cat).classList.toggle("active", cat === currentCategory);
      });

      const list = getChats(currentCategory);
      const active = getActiveChatObj();

      const chipsBar = document.getElementById("chatChipsBar");
      chipsBar.innerHTML = list.map(c => `
        <button class="chat-chip ${String(c.id) === String(active.id) ? "active" : ""}" onclick="pickChatById('${String(c.id).replace(/'/g, "\\'")}')">
          ${c.name}
        </button>
      `).join("");

      const sel = document.getElementById("chatSelector");
      sel.innerHTML = list.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
      if (active.id) sel.value = active.id;

      updateProfileBox(active);
    }

    function pickChatById(cid) {
      const list = getChats(currentCategory);
      const found = list.find(c => String(c.id) === String(cid));
      if (found) {
        localStorage.setItem("anirem_active_id_" + currentCategory, found.id);
        updateProfileBox(found);
      }
      clearReply();
      cancelEdit();
      hideJumpBanner();
      renderChatSelector();
      renderMsgs();
    }

    function updateProfileBox(chatObj) {
      const link = buildLink(chatObj);
      document.getElementById("profileTitle").textContent = chatObj.name || "Chat";
      document.getElementById("metaId").textContent = chatObj.id || "-";
      const a = document.getElementById("metaLink");
      a.textContent = link || "-";
      a.href = link || "#";
    }

    function selectCategory(cat) {
      currentCategory = cat;
      localStorage.setItem("anirem_cat", cat);
      clearReply();
      cancelEdit();
      hideJumpBanner();
      renderChatSelector();
      renderMsgs();
    }

    function switchChat() {
      pickChatById(document.getElementById("chatSelector").value);
    }

    function toggleCustomBar() {
      document.getElementById("customBar").classList.toggle("active");
    }

    function addCustomChat() {
      const cname = document.getElementById("customNameInput").value.trim();
      const cid = document.getElementById("customIdInput").value.trim();
      const clink = document.getElementById("customLinkInput").value.trim();
      if (!cid) return;
      const list = getChats(currentCategory);
      if (!list.some(x => String(x.id) === cid)) {
        list.push({ id: cid, name: cname || cid, link: clink || "" });
        saveChats(currentCategory, list);
      }
      localStorage.setItem("anirem_active_id_" + currentCategory, cid);
      document.getElementById("customNameInput").value = "";
      document.getElementById("customIdInput").value = "";
      document.getElementById("customLinkInput").value = "";
      document.getElementById("customBar").classList.remove("active");
      renderChatSelector();
      renderMsgs();
    }

    function msgStorageKey() {
      const active = getActiveChatObj();
      return "anirem_chat_v3_" + currentCategory + "_" + active.id;
    }

    function dedupeById(list) {
      const seen = new Set();
      return list.filter(item => {
        const key = String(item.id);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      });
    }

    function loadMsgs() {
      const raw = localStorage.getItem(msgStorageKey());
      if (!raw) return [];
      const parsed = dedupeById(JSON.parse(raw));
      localStorage.setItem(msgStorageKey(), JSON.stringify(parsed));
      return parsed;
    }

    function saveMsgs(list) {
      localStorage.setItem(msgStorageKey(), JSON.stringify(dedupeById(list)));
    }

    function nowTime() {
      return new Date().toTimeString().slice(0, 8);
    }

    function hideJumpBanner() {
      document.getElementById("jumpBanner").classList.remove("active");
    }

    function jumpToMessage(targetId) {
      const el = document.getElementById("msg-row-" + targetId);
      if (!el) return;
      document.querySelectorAll(".msg-card.highlighted").forEach(n => n.classList.remove("highlighted"));
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      const card = el.querySelector(".msg-card");
      if (card) card.classList.add("highlighted");
      document.getElementById("jumpBannerText").textContent = `Mana shu xabarga reply qilingan (#${targetId})`;
      document.getElementById("jumpBanner").classList.add("active");
      setTimeout(() => { if (card) card.classList.remove("highlighted"); }, 2500);
    }

    function renderMsgs() {
      const box = document.getElementById("messagesList");
      const list = loadMsgs();
      if (!list.length) {
        box.innerHTML = "";
        return;
      }
      box.innerHTML = list.map(m => {
        const dir = m.direction === "incoming" ? "incoming" : "outgoing";
        const author = m.direction === "incoming" ? (m.sender || "Obunachi") : "Bot";
        const hasReply = m.replyTo && (m.replyTo.text || m.replyTo.id);
        let contentHtml = "";
        if (m.type === "sticker") {
          contentHtml = `<div class="sticker-view">${m.sticker || "🧸"}</div>`;
        } else if (m.type === "voice") {
          contentHtml = `<div class="voice-view">🎙 Ovozli xabar • ${m.duration || "0:05"}</div>`;
        }
        if (m.text) {
          contentHtml += `<div class="msg-body">${m.text}</div>`;
        }

        return `
          <div id="msg-row-${m.id}" class="msg-row ${dir}">
            <div class="msg-card">
              <div class="msg-head">
                <span>${author}</span>
                <span class="msg-time">${m.time} • #${m.id}</span>
              </div>
              ${hasReply ? `
                <div class="reply-box" onclick="jumpToMessage(${m.replyTo.id || 0})">
                  <b>↩️ ${m.replyTo.sender || "Xabar"} ${m.replyTo.id ? "#" + m.replyTo.id : ""}</b><br/>
                  <span>${m.replyTo.text || ""}</span>
                </div>
              ` : ""}
              ${contentHtml}
              <div class="msg-actions">
                ${m.reaction ? `<span class="react-badge">${m.reaction}</span>` : ""}
                <button class="chip" onclick="startReply(${m.id})">Reply</button>
                <button class="chip" onclick="reactMsg(${m.id}, '❤️')">❤️</button>
                <button class="chip" onclick="reactMsg(${m.id}, '👍')">👍</button>
                <button class="chip" onclick="reactMsg(${m.id}, '😂')">😂</button>
                <button class="chip" onclick="startEdit(${m.id})">Tahrirlash</button>
                <button class="chip del" onclick="deleteMsg(${m.id})">O'chirish</button>
              </div>
            </div>
          </div>
        `;
      }).join("");
      box.scrollTop = box.scrollHeight;
    }

    function addEmoji(em) {
      const inp = document.getElementById("msgInput");
      inp.value += em;
      inp.focus();
    }

    function startReply(id) {
      const found = loadMsgs().find(x => x.id === id);
      if (!found) return;
      const previewText = found.text || found.sticker || (found.type === "voice" ? `Ovozli xabar (${found.duration || "0:05"})` : "Xabar");
      const author = found.direction === "incoming" ? (found.sender || "Obunachi") : "Bot";
      replyTarget = { id: found.id, sender: author, text: previewText };
      document.getElementById("replyText").textContent = `↩️ #${found.id} (${author}): ${previewText}`;
      document.getElementById("replyBar").classList.add("active");
    }

    function clearReply() {
      replyTarget = null;
      document.getElementById("replyBar").classList.remove("active");
    }

    function startEdit(id) {
      const found = loadMsgs().find(x => x.id === id);
      if (!found) return;
      editingMsgId = id;
      document.getElementById("msgInput").value = found.text || found.sticker || "";
      document.getElementById("submitBtn").textContent = "Saqlash";
      document.getElementById("editingBadge").textContent = `Tahrir: #${id}`;
    }

    function cancelEdit() {
      editingMsgId = null;
      document.getElementById("submitBtn").textContent = "Yuborish";
      document.getElementById("editingBadge").textContent = "";
    }

    function reactMsg(id, emoji) {
      const active = getActiveChatObj();
      const list = loadMsgs();
      const item = list.find(x => x.id === id);
      if (!item) return;
      item.reaction = item.reaction === emoji ? "" : emoji;
      saveMsgs(list);
      renderMsgs();
      if (tg) {
        tg.sendData(JSON.stringify({
          action: "react_msg",
          target_id: active.id,
          message_id: id,
          emoji
        }));
      }
    }

    function deleteMsg(id) {
      const active = getActiveChatObj();
      const list = loadMsgs().filter(x => x.id !== id);
      saveMsgs(list);
      renderMsgs();
      if (tg) {
        tg.sendData(JSON.stringify({
          action: "delete_sent_msg",
          target_id: active.id,
          message_id: id
        }));
      }
    }

    function pushOutMsg(payloadObj) {
      const active = getActiveChatObj();
      const list = loadMsgs();
      const newId = Math.floor(Date.now() + Math.random() * 900) % 1000000;
      const item = {
        id: newId,
        direction: "outgoing",
        sender: "Bot",
        time: nowTime(),
        replyTo: replyTarget ? { id: replyTarget.id, sender: replyTarget.sender, text: replyTarget.text } : null,
        reaction: "",
        ...payloadObj
      };
      list.push(item);
      saveMsgs(list);
      renderMsgs();

      if (tg) {
        tg.sendData(JSON.stringify({
          action: "send_direct",
          target_id: active.id,
          text: item.text || item.sticker || `🎙 Ovozli xabar (${item.duration || "0:05"})`,
          media_type: item.type || "text",
          show_sender: false,
          reply_to_message_id: replyTarget ? replyTarget.id : null
        }));
      }
    }

    function sendStickerItem(stickerChar) {
      if (isSubmitting) return;
      isSubmitting = true;
      pushOutMsg({ type: "sticker", sticker: stickerChar, text: "" });
      clearReply();
      setTimeout(() => { isSubmitting = false; }, 250);
    }

    function sendVoiceItem(durationStr) {
      if (isSubmitting) return;
      isSubmitting = true;
      pushOutMsg({ type: "voice", duration: durationStr, text: "" });
      clearReply();
      setTimeout(() => { isSubmitting = false; }, 250);
    }

    function submitMessage() {
      if (isSubmitting) return;
      const inp = document.getElementById("msgInput");
      const text = inp.value.trim();
      if (!text) return;
      isSubmitting = true;

      const active = getActiveChatObj();
      const list = loadMsgs();

      if (editingMsgId !== null) {
        const item = list.find(x => x.id === editingMsgId);
        if (item) {
          if (item.type === "sticker") {
            item.sticker = text;
          } else {
            item.text = text;
          }
          saveMsgs(list);
          if (tg) {
            tg.sendData(JSON.stringify({
              action: "edit_sent_msg",
              target_id: active.id,
              message_id: editingMsgId,
              text
            }));
          }
        }
        inp.value = "";
        cancelEdit();
        renderMsgs();
        setTimeout(() => { isSubmitting = false; }, 250);
        return;
      }

      pushOutMsg({ type: "text", text });
      inp.value = "";
      clearReply();
      setTimeout(() => { isSubmitting = false; }, 250);
    }

    renderChatSelector();
    renderMsgs();
  </script>
</body>
</html>
