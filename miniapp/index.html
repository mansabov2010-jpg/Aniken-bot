<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      min-height: 100vh;
      color: #ffffff;
      background:
        linear-gradient(180deg, rgba(6, 24, 38, 0.35) 0%, rgba(4, 15, 26, 0.65) 100%),
        url("./bg-girl.jpg") center / cover no-repeat fixed;
      padding: 18px 14px 32px;
    }
    .header {
      background: rgba(10, 35, 55, 0.52);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(90, 235, 255, 0.35);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 8px 28px rgba(0, 195, 255, 0.2);
    }
    .header h1 { font-size: 19px; font-weight: 700; color: #7ef2ff; }
    .header p { font-size: 13px; color: #e8fbff; margin-top: 4px; opacity: 0.92; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn {
      background: rgba(12, 42, 66, 0.55);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(126, 242, 255, 0.38);
      border-radius: 15px;
      padding: 14px 12px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .btn:active { transform: scale(0.97); background: rgba(0, 180, 230, 0.45); }
    .btn.full { grid-column: 1 / -1; text-align: center; background: rgba(0, 165, 220, 0.45); }
    .card {
      margin-top: 14px;
      background: rgba(8, 26, 42, 0.62);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(126, 242, 255, 0.3);
      border-radius: 16px;
      padding: 14px;
      font-size: 13.5px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🛡 Admin Boshqaruv Mini App</h1>
    <p id="admin-info">Admin sessiyasi tekshirilmoqda...</p>
  </div>

  <div class="grid">
    <button class="btn" onclick="sendAction('stats')">📊 Statistika</button>
    <button class="btn" onclick="sendAction('req_channels')">🔒 Majburiy a'zo</button>
    <button class="btn" onclick="sendAction('bc_users')">3/1 👤 Userlarga</button>
    <button class="btn" onclick="sendAction('bc_chats')">3/2 📢 Kanal/Chat</button>
    <button class="btn full" onclick="sendAction('bc_all')">3/3 🌐 Barchaga xabar</button>
    <button class="btn" onclick="sendAction('add_content')">🎬 Film joylash</button>
    <button class="btn" onclick="sendAction('edit_content')">✏️ Tahrirlash</button>
  </div>

  <div class="card" id="status-box">
    • <b>3 bo'limli tarqatish:</b> 3/1 foydalanuvchilar, 3/2 kanal/chatlar, 3/3 barchaga.<br>
    • <b>Tahrirlash:</b> har bir bosqichda eski holatda qoldirish tugmasi mavjud.<br>
    • <b>Kanal reklama:</b> joylangan kontentni kanalga bir bosishda yuborish.
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    document.getElementById("admin-info").innerText =
      user ? `Admin: ${user.first_name} (ID: ${user.id})` : "Telegram Admin Panel";

    function sendAction(action) {
      tg.sendData(JSON.stringify({ action }));
      tg.close();
    }
  </script>
</body>
</html>
