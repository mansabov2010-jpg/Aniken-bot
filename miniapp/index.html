<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniREM Admin Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b1020;
      --card: rgba(18, 26, 48, 0.88);
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.22);
      --danger: #f43f5e;
      --ok: #22c55e;
    }
    * { box-sizing: border-box; font-family: Inter, system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(11, 16, 32, 0.82), rgba(11, 16, 32, 0.94)),
        url("bg-girl.jpg") center/cover no-repeat fixed;
      padding: 16px;
    }
    .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      backdrop-filter: blur(10px);
    }
    .hero h1 { margin: 0 0 4px; font-size: 18px; }
    .hero p { margin: 0; font-size: 12.5px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button.btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: transform .12s ease, border-color .15s ease;
    }
    button.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    button.btn.primary { background: linear-gradient(135deg, #0284c7, #4f46e5); border: none; }
    button.btn.danger { background: rgba(244, 63, 94, 0.16); border-color: rgba(244, 63, 94, 0.45); color: #fda4af; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .panel h3 { margin: 0; font-size: 14px; }
    label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 5px; }
    input, textarea {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
    }
    textarea { min-height: 76px; resize: vertical; }
    .row { display: flex; align-items: center; gap: 8px; }
    .log-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      background: rgba(15, 23, 42, 0.65);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12.5px;
    }
    .meta { color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>🛡 AniREM Admin Mini App</h1>
      <p id="statusBar">Telegram WebApp ulanmoqda...</p>
    </div>

    <div class="grid">
      <button class="btn primary" onclick="sendAction('stats')">📊 Statistika</button>
      <button class="btn" onclick="sendAction('add_content')">🎬 Kontent joylash</button>
      <button class="btn" onclick="sendAction('bc_users')">3/1 👤 Userlarga xabar</button>
      <button class="btn" onclick="sendAction('bc_chats')">3/2 📢 Kanal/Chatlarga</button>
      <button class="btn" onclick="sendAction('bc_all')">3/3 🌐 Barchaga xabar</button>
      <button class="btn" onclick="sendAction('edit_content')">✏️ Kontent tahrirlash</button>
    </div>

    <div class="panel">
      <h3>✉️ Boshqaga xabar yozish, tahrirlash va o'chirish</h3>
      <label>
        Foydalanuvchi / Chat ID
        <input id="targetId" type="text" placeholder="Masalan: 7986354170" />
      </label>
      <label>
        Xabar matni
        <textarea id="msgText" placeholder="Yuboriladigan xabar matnini yozing..."></textarea>
      </label>
      <label class="row">
        <input id="showSender" type="checkbox" checked style="width:auto;" />
        <span>Yozgan admin ma'lumotini ko'rsatish (bilintirish)</span>
      </label>
      <div class="grid">
        <button class="btn primary" onclick="sendDirect()">📤 Xabar yuborish</button>
        <button class="btn" onclick="editMsg()">✏️ Xabarni tahrirlash</button>
      </div>
      <label>
        Xabar ID (tahrirlash yoki o'chirish uchun)
        <input id="msgId" type="text" placeholder="Masalan: 125" />
      </label>
      <button class="btn danger" onclick="deleteMsg()">🗑 Xabarni o'chirish</button>
    </div>

    <div class="panel">
      <h3>🕒 Yuborilgan xabarlar tarixi (shu sessiyada)</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
      document.getElementById("statusBar").textContent = user
        ? `Admin: ${user.first_name || ""} (ID: ${user.id}) • Faol`
        : "WebApp tayyor";
    } else {
      document.getElementById("statusBar").textContent = "Brauzer rejimi (Telegram ichida oching)";
    }

    const historyItems = JSON.parse(localStorage.getItem("anirem_msg_hist") || "[]");

    function renderHistory() {
      const box = document.getElementById("historyList");
      if (!historyItems.length) {
        box.innerHTML = '<div class="meta">Hozircha yuborilgan xabarlar yo‘q.</div>';
        return;
      }
      box.innerHTML = historyItems.map((it, idx) => `
        <div class="log-item">
          <div><b>#${idx + 1}</b> → <code>${it.target_id}</code> ${it.show_sender ? "• <i>Kim yozgani ko'rsatiladi</i>" : "• <i>Yashirin</i>"}</div>
          <div>${it.text}</div>
          <div class="row">
            <button class="btn" style="padding:6px 10px;" onclick="fillFromHist('${it.target_id}', '${encodeURIComponent(it.text)}')">Tanlash</button>
          </div>
        </div>
      `).join("");
    }

    function fillFromHist(tid, encodedText) {
      document.getElementById("targetId").value = tid;
      document.getElementById("msgText").value = decodeURIComponent(encodedText);
    }

    function pushData(obj) {
      if (!tg) {
        alert("Telegram WebApp topilmadi. Bot ichidan oching.");
        return;
      }
      tg.sendData(JSON.stringify(obj));
    }

    function sendAction(action) {
      pushData({ action });
    }

    function sendDirect() {
      const target_id = document.getElementById("targetId").value.trim();
      const text = document.getElementById("msgText").value.trim();
      const show_sender = document.getElementById("showSender").checked;
      if (!target_id || !text) {
        alert("ID va xabar matnini kiriting!");
        return;
      }
      historyItems.unshift({ target_id, text, show_sender, time: Date.now() });
      localStorage.setItem("anirem_msg_hist", JSON.stringify(historyItems.slice(0, 20)));
      renderHistory();
      pushData({ action: "send_direct", target_id, text, show_sender });
    }

    function editMsg() {
      const target_id = document.getElementById("targetId").value.trim();
      const message_id = document.getElementById("msgId").value.trim();
      const text = document.getElementById("msgText").value.trim();
      if (!target_id || !message_id || !text) {
        alert("ID, Xabar ID va yangi matnni kiriting!");
        return;
      }
      pushData({ action: "edit_sent_msg", target_id, message_id, text });
    }

    function deleteMsg() {
      const target_id = document.getElementById("targetId").value.trim();
      const message_id = document.getElementById("msgId").value.trim();
      if (!target_id || !message_id) {
        alert("ID va Xabar ID ni kiriting!");
        return;
      }
      pushData({ action: "delete_sent_msg", target_id, message_id });
    }

    renderHistory();
  </script>
</body>
</html>
