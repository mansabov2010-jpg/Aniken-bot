<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniREM Chat Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --panel: rgba(17, 24, 39, 0.84);
      --bubble: rgba(24, 33, 52, 0.90);
      --quote: rgba(15, 23, 42, 0.85);
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, 0.22);
    }
    * { box-sizing: border-box; font-family: Inter, system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(10, 15, 28, 0.55), rgba(10, 15, 28, 0.78)),
        url("bg-girl.jpg") center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
    }
    .topbar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      backdrop-filter: blur(8px);
    }
    .chat-select {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
    }
    .small-btn {
      background: rgba(30, 41, 59, 0.9);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .chat-id-bar {
      display: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      gap: 8px;
    }
    .chat-id-bar.active { display: flex; }
    .chat-id-bar input {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12.5px;
    }
    .messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 12px;
    }
    .msg-card {
      width: 86%;
      background: var(--bubble);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 9px 11px;
      backdrop-filter: blur(7px);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .msg-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      color: var(--accent);
      font-weight: 600;
    }
    .msg-time { color: var(--muted); font-size: 10.5px; font-weight: 400; }
    .reply-box {
      background: var(--quote);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 11.5px;
      color: #e2e8f0;
    }
    .msg-body { font-size: 13.5px; line-height: 1.38; word-break: break-word; }
    .msg-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 2px;
    }
    .chip {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .react-badge {
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .composer {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(10px);
    }
    .reply-preview {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: var(--quote);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .reply-preview.active { display: flex; }
    .emoji-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .emoji-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .input-row { display: flex; gap: 8px; }
    .input-row input {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 13px;
    }
    .send-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .sub-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <select id="chatSelector" class="chat-select" onchange="switchChat()">
      <option value="7986354170">💬 Admin Chat (7986354170)</option>
      <option value="7637155944">💬 Ikkinchi Admin (7637155944)</option>
      <option value="@AniKinolar_kanal">📢 @AniKinolar_kanal</option>
      <option value="custom">➕ Boshqa Chat / User ID...</option>
    </select>
    <button class="small-btn" onclick="toggleCustomId()">ID</button>
  </div>

  <div id="customIdBar" class="chat-id-bar">
    <input id="customChatInput" type="text" placeholder="Chat ID yoki @username kiriting..." />
    <button class="small-btn" onclick="applyCustomChat()">Saqlash</button>
  </div>

  <div id="messagesList" class="messages"></div>

  <div class="composer">
    <div id="replyBar" class="reply-preview">
      <span id="replyText">Reply...</span>
      <button class="chip" onclick="clearReply()">✕</button>
    </div>

    <div class="emoji-row">
      <button class="emoji-btn" onclick="addEmoji('😀')">😀</button>
      <button class="emoji-btn" onclick="addEmoji('😋')">😋</button>
      <button class="emoji-btn" onclick="addEmoji('😜')">😜</button>
      <button class="emoji-btn" onclick="addEmoji('😂')">😂</button>
      <button class="emoji-btn" onclick="addEmoji('🔥')">🔥</button>
      <button class="emoji-btn" onclick="addEmoji('❤️')">❤️</button>
      <button class="emoji-btn" onclick="addEmoji('👍')">👍</button>
      <button class="emoji-btn" onclick="addEmoji('⚡')">⚡</button>
    </div>

    <div class="input-row">
      <input id="msgInput" type="text" placeholder="Xabar yozing..." />
      <button id="submitBtn" class="send-btn" onclick="submitMessage()">Yuborish</button>
    </div>

    <div class="sub-row">
      <label style="display:flex;align-items:center;gap:5px;cursor:pointer;">
        <input id="showSender" type="checkbox" checked />
        <span>Yozganini ko'rsatish</span>
      </label>
      <span id="editingBadge" style="color:#38bdf8;"></span>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    let currentSenderName = "EREN yefer";
    if (tg) {
      tg.ready();
      tg.expand();
      const u = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
      if (u && u.first_name) currentSenderName = u.first_name;
    }

    let activeChat = localStorage.getItem("anirem_active_chat") || "7986354170";
    let replyTarget = null;
    let editingMsgId = null;

    const sel = document.getElementById("chatSelector");
    if ([...sel.options].some(o => o.value === activeChat)) {
      sel.value = activeChat;
    } else {
      const opt = document.createElement("option");
      opt.value = activeChat;
      opt.textContent = `💬 ${activeChat}`;
      sel.insertBefore(opt, sel.lastElementChild);
      sel.value = activeChat;
    }

    function storeKey() {
      return "anirem_chat_msgs_" + activeChat;
    }

    function loadMsgs() {
      const raw = localStorage.getItem(storeKey());
      if (raw) return JSON.parse(raw);
      return [
        {
          id: 101,
          sender: "Violet",
          time: "17:36:10",
          replyTo: null,
          text: "Salom! Chat tayyor.",
          reaction: ""
        },
        {
          id: 102,
          sender: currentSenderName,
          time: "17:36:49",
          replyTo: { sender: "Violet", text: "Salom! Chat tayyor." },
          text: "Xay xay 😄",
          reaction: "❤️"
        }
      ];
    }

    function saveMsgs(list) {
      localStorage.setItem(storeKey(), JSON.stringify(list));
    }

    function nowTime() {
      const d = new Date();
      return d.toTimeString().slice(0, 8);
    }

    function renderMsgs() {
      const box = document.getElementById("messagesList");
      const list = loadMsgs();
      if (!list.length) {
        box.innerHTML = '<div class="msg-card"><div class="msg-body">Bu chatda hali xabar yo‘q.</div></div>';
        return;
      }
      box.innerHTML = list.map(m => `
        <div class="msg-card">
          <div class="msg-head">
            <span>${m.sender}</span>
            <span class="msg-time">${m.time} • #${m.id}</span>
          </div>
          ${m.replyTo ? `<div class="reply-box"><b>${m.replyTo.sender}</b><br/>${m.replyTo.text}</div>` : ""}
          <div class="msg-body">${m.text}</div>
          <div class="msg-actions">
            ${m.reaction ? `<span class="react-badge">${m.reaction}</span>` : ""}
            <button class="chip" onclick="startReply(${m.id})">Reply</button>
            <button class="chip" onclick="reactMsg(${m.id}, '❤️')">❤️</button>
            <button class="chip" onclick="reactMsg(${m.id}, '👍')">👍</button>
            <button class="chip" onclick="reactMsg(${m.id}, '😂')">😂</button>
            <button class="chip" onclick="startEdit(${m.id})">Tahrir</button>
            <button class="chip" onclick="deleteMsg(${m.id})">O'chir</button>
          </div>
        </div>
      `).join("");
    }

    function switchChat() {
      const val = sel.value;
      if (val === "custom") {
        document.getElementById("customIdBar").classList.add("active");
        return;
      }
      document.getElementById("customIdBar").classList.remove("active");
      activeChat = val;
      localStorage.setItem("anirem_active_chat", activeChat);
      clearReply();
      cancelEdit();
      renderMsgs();
    }

    function toggleCustomId() {
      document.getElementById("customIdBar").classList.toggle("active");
    }

    function applyCustomChat() {
      const v = document.getElementById("customChatInput").value.trim();
      if (!v) return;
      if (![...sel.options].some(o => o.value === v)) {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = `💬 ${v}`;
        sel.insertBefore(opt, sel.lastElementChild);
      }
      sel.value = v;
      activeChat = v;
      localStorage.setItem("anirem_active_chat", activeChat);
      document.getElementById("customIdBar").classList.remove("active");
      renderMsgs();
    }

    function addEmoji(em) {
      const inp = document.getElementById("msgInput");
      inp.value += em;
      inp.focus();
    }

    function startReply(id) {
      const list = loadMsgs();
      const found = list.find(x => x.id === id);
      if (!found) return;
      replyTarget = { id: found.id, sender: found.sender, text: found.text };
      document.getElementById("replyText").textContent = `↩️ ${found.sender}: ${found.text}`;
      document.getElementById("replyBar").classList.add("active");
    }

    function clearReply() {
      replyTarget = null;
      document.getElementById("replyBar").classList.remove("active");
    }

    function startEdit(id) {
      const list = loadMsgs();
      const found = list.find(x => x.id === id);
      if (!found) return;
      editingMsgId = id;
      document.getElementById("msgInput").value = found.text;
      document.getElementById("submitBtn").textContent = "Saqlash";
      document.getElementById("editingBadge").textContent = `Tahrir: #${id}`;
    }

    function cancelEdit() {
      editingMsgId = null;
      document.getElementById("submitBtn").textContent = "Yuborish";
      document.getElementById("editingBadge").textContent = "";
    }

    function reactMsg(id, emoji) {
      const list = loadMsgs();
      const item = list.find(x => x.id === id);
      if (!item) return;
      item.reaction = item.reaction === emoji ? "" : emoji;
      saveMsgs(list);
      renderMsgs();
      if (tg) {
        tg.sendData(JSON.stringify({
          action: "react_msg",
          target_id: activeChat,
          message_id: id,
          emoji
        }));
      }
    }

    function deleteMsg(id) {
      const list = loadMsgs().filter(x => x.id !== id);
      saveMsgs(list);
      renderMsgs();
      if (tg) {
        tg.sendData(JSON.stringify({
          action: "delete_sent_msg",
          target_id: activeChat,
          message_id: id
        }));
      }
    }

    function submitMessage() {
      const inp = document.getElementById("msgInput");
      const text = inp.value.trim();
      if (!text) return;
      const showSender = document.getElementById("showSender").checked;
      const list = loadMsgs();

      if (editingMsgId !== null) {
        const item = list.find(x => x.id === editingMsgId);
        if (item) {
          item.text = text;
          saveMsgs(list);
          if (tg) {
            tg.sendData(JSON.stringify({
              action: "edit_sent_msg",
              target_id: activeChat,
              message_id: editingMsgId,
              text
            }));
          }
        }
        inp.value = "";
        cancelEdit();
        renderMsgs();
        return;
      }

      const newId = Math.floor(Date.now() / 1000) % 100000;
      const senderLabel = showSender ? currentSenderName : "Bot";
      list.push({
        id: newId,
        sender: senderLabel,
        time: nowTime(),
        replyTo: replyTarget ? { sender: replyTarget.sender, text: replyTarget.text } : null,
        text,
        reaction: ""
      });
      saveMsgs(list);

      if (tg) {
        tg.sendData(JSON.stringify({
          action: "send_direct",
          target_id: activeChat,
          text,
          show_sender: showSender,
          reply_to_message_id: replyTarget ? replyTarget.id : null
        }));
      }

      inp.value = "";
      clearReply();
      renderMsgs();
    }

    renderMsgs();
  </script>
</body>
</html>
