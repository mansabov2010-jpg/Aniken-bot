<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniREM Chat Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --panel: rgba(15, 23, 42, 0.62);
      --bubble: rgba(19, 28, 46, 0.72);
      --quote: rgba(15, 23, 42, 0.75);
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --line: rgba(226, 232, 240, 0.24);
    }
    * { box-sizing: border-box; font-family: Inter, system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(10, 15, 28, 0.22), rgba(10, 15, 28, 0.46)),
        url("bg-girl.jpg") center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
    }
    .cat-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 5px;
      backdrop-filter: blur(5px);
    }
    .cat-tab {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      padding: 7px 6px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .cat-tab.active {
      background: rgba(56, 189, 248, 0.28);
      border-color: var(--accent);
    }
    .topbar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      gap: 6px;
      align-items: center;
      backdrop-filter: blur(5px);
    }
    .chat-select {
      flex: 1;
      background: rgba(15, 23, 42, 0.78);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 7px 9px;
      font-size: 12.5px;
      font-weight: 600;
    }
    .small-btn {
      background: rgba(30, 41, 59, 0.85);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .chat-meta-outside {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 7px 10px;
      font-size: 11.5px;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      backdrop-filter: blur(5px);
    }
    .chat-meta-outside a {
      color: #7dd3fc;
      text-decoration: none;
      word-break: break-all;
    }
    .custom-bar {
      display: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 7px 9px;
      gap: 6px;
    }
    .custom-bar.active { display: flex; }
    .custom-bar input {
      flex: 1;
      background: rgba(15, 23, 42, 0.82);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }
    .msg-card {
      width: 88%;
      background: var(--bubble);
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 8px 10px;
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .msg-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      color: #7dd3fc;
      font-weight: 700;
    }
    .msg-time { color: var(--muted); font-size: 10.5px; font-weight: 400; }
    .reply-box {
      background: var(--quote);
      border-left: 3px solid var(--accent);
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 11px;
      color: #f1f5f9;
    }
    .msg-body { font-size: 13.5px; line-height: 1.35; word-break: break-word; }
    .msg-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }
    .chip {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 7px;
      padding: 3px 7px;
      font-size: 11px;
      cursor: pointer;
    }
    .react-badge {
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 7px;
      background: rgba(56, 189, 248, 0.25);
      border: 1px solid rgba(56, 189, 248, 0.45);
    }
    .composer {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      backdrop-filter: blur(6px);
    }
    .reply-preview {
      display: none;
      justify-content: space-between;
      align-items: center;
      background: var(--quote);
      border-left: 3px solid var(--accent);
      border-radius: 7px;
      padding: 5px 8px;
      font-size: 11.5px;
    }
    .reply-preview.active { display: flex; }
    .emoji-row {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .emoji-btn {
      background: rgba(30, 41, 59, 0.82);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px 7px;
      font-size: 13.5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .input-row { display: flex; gap: 6px; }
    .input-row input {
      flex: 1;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 13px;
    }
    .send-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 9px;
      padding: 0 13px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
    }
    .sub-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="cat-tabs">
    <button id="tab-groups" class="cat-tab active" onclick="selectCategory('groups')">👥 Guruhlar</button>
    <button id="tab-channels" class="cat-tab" onclick="selectCategory('channels')">📢 Kanallar</button>
    <button id="tab-contacts" class="cat-tab" onclick="selectCategory('contacts')">👤 Kontaktlar</button>
  </div>

  <div class="topbar">
    <select id="chatSelector" class="chat-select" onchange="switchChat()"></select>
    <button class="small-btn" onclick="toggleCustomBar()">+ Qo'shish</button>
  </div>

  <div id="customBar" class="custom-bar">
    <input id="customIdInput" type="text" placeholder="ID yoki @username..." />
    <input id="customLinkInput" type="text" placeholder="Havola (ixtiyoriy, https://t.me/...)" />
    <button class="small-btn" onclick="addCustomChat()">Saqlash</button>
  </div>

  <div id="chatMetaOutside" class="chat-meta-outside">
    <span><b>ID:</b> <code id="metaId">-</code></span>
    <span><b>Havola:</b> <a id="metaLink" href="#" target="_blank">-</a></span>
  </div>

  <div id="messagesList" class="messages"></div>

  <div class="composer">
    <div id="replyBar" class="reply-preview">
      <span id="replyText">Reply...</span>
      <button class="chip" onclick="clearReply()">✕</button>
    </div>

    <div class="emoji-row">
      <button class="emoji-btn" onclick="addEmoji('😀')">😀</button>
      <button class="emoji-btn" onclick="addEmoji('😋')">😋</button>
      <button class="emoji-btn" onclick="addEmoji('😜')">😜</button>
      <button class="emoji-btn" onclick="addEmoji('😂')">😂</button>
      <button class="emoji-btn" onclick="addEmoji('🔥')">🔥</button>
      <button class="emoji-btn" onclick="addEmoji('❤️')">❤️</button>
      <button class="emoji-btn" onclick="addEmoji('👍')">👍</button>
      <button class="emoji-btn" onclick="addEmoji('⚡')">⚡</button>
      <button class="emoji-btn" onclick="addEmoji('💎')">💎</button>
      <button class="emoji-btn" onclick="addEmoji('👑')">👑</button>
      <button class="emoji-btn" onclick="addEmoji('✨')">✨</button>
      <button class="emoji-btn" onclick="addEmoji('🌟')">🌟</button>
    </div>

    <div class="input-row">
      <input id="msgInput" type="text" placeholder="Bot nomidan xabar yozing..." />
      <button id="submitBtn" class="send-btn" onclick="submitMessage()">Yuborish</button>
    </div>

    <div class="sub-row">
      <span>Yozuvchi: <b>Bot</b></span>
      <span id="editingBadge" style="color:#7dd3fc;"></span>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const DEFAULT_CHATS = {
      groups: [
        { id: "-1002000000001", name: "Anime Muhokama Guruhi", link: "https://t.me/joinchat/group_demo" }
      ],
      channels: [
        { id: "@AniKinolar_kanal", name: "AniKinolar Asosiy Kanal", link: "https://t.me/AniKinolar_kanal" }
      ],
      contacts: [
        { id: "7986354170", name: "Obunachi / Kontakt #1", link: "https://t.me/Yegerist_mvp" },
        { id: "7637155944", name: "Obunachi / Kontakt #2", link: "https://t.me/AniRembot" }
      ]
    };

    let currentCategory = localStorage.getItem("anirem_cat") || "groups";
    let replyTarget = null;
    let editingMsgId = null;

    function getChats(cat) {
      const saved = JSON.parse(localStorage.getItem("anirem_chats_" + cat) || "null");
      if (Array.isArray(saved) && saved.length) return saved;
      return DEFAULT_CHATS[cat] || [];
    }

    function saveChats(cat, list) {
      localStorage.setItem("anirem_chats_" + cat, JSON.stringify(list));
    }

    function getActiveChatObj() {
      const list = getChats(currentCategory);
      const savedId = localStorage.getItem("anirem_active_id_" + currentCategory);
      return list.find(c => String(c.id) === String(savedId)) || list[0] || { id: "", name: "Chat", link: "" };
    }

    function buildLink(chatObj) {
      if (chatObj.link) return chatObj.link;
      if (String(chatObj.id).startsWith("@")) {
        return "https://t.me/" + String(chatObj.id).slice(1);
      }
      const numId = String(chatObj.id).replace(/^-100/, "");
      return "https://t.me/c/" + numId;
    }

    function renderChatSelector() {
      ["groups", "channels", "contacts"].forEach(cat => {
        document.getElementById("tab-" + cat).classList.toggle("active", cat === currentCategory);
      });

      const list = getChats(currentCategory);
      const active = getActiveChatObj();
      const sel = document.getElementById("chatSelector");
      sel.innerHTML = list.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
      if (active.id) sel.value = active.id;

      updateMetaOutside(active);
    }

    function updateMetaOutside(chatObj) {
      const link = buildLink(chatObj);
      document.getElementById("metaId").textContent = chatObj.id || "-";
      const a = document.getElementById("metaLink");
      a.textContent = link || "-";
      a.href = link || "#";
    }

    function selectCategory(cat) {
      currentCategory = cat;
      localStorage.setItem("anirem_cat", cat);
      clearReply();
      cancelEdit();
      renderChatSelector();
      renderMsgs();
    }

    function switchChat() {
      const sel = document.getElementById("chatSelector");
      const list = getChats(currentCategory);
      const found = list.find(c => String(c.id) === String(sel.value));
      if (found) {
        localStorage.setItem("anirem_active_id_" + currentCategory, found.id);
        updateMetaOutside(found);
      }
      clearReply();
      cancelEdit();
      renderMsgs();
    }

    function toggleCustomBar() {
      document.getElementById("customBar").classList.toggle("active");
    }

    function addCustomChat() {
      const cid = document.getElementById("customIdInput").value.trim();
      const clink = document.getElementById("customLinkInput").value.trim();
      if (!cid) return;
      const list = getChats(currentCategory);
      if (!list.some(x => String(x.id) === cid)) {
        list.push({ id: cid, name: cid, link: clink || "" });
        saveChats(currentCategory, list);
      }
      localStorage.setItem("anirem_active_id_" + currentCategory, cid);
      document.getElementById("customIdInput").value = "";
      document.getElementById("customLinkInput").value = "";
      document.getElementById("customBar").classList.remove("active");
      renderChatSelector();
      renderMsgs();
    }

    function msgStorageKey() {
      const active = getActiveChatObj();
      return "anirem_msgs_" + currentCategory + "_" + active.id;
    }

    function loadMsgs() {
      const raw = localStorage.getItem(msgStorageKey());
      if (raw) return JSON.parse(raw);
      return [
        {
          id: 101,
          sender: "Bot",
          time: "13:20:00",
          replyTo: null,
          text: "Muloqot oynasi faol.",
          reaction: ""
        }
      ];
    }

    function saveMsgs(list) {
      localStorage.setItem(msgStorageKey(), JSON.stringify(list));
    }

    function nowTime() {
      return new Date().toTimeString().slice(0, 8);
    }

    function renderMsgs() {
      const box = document.getElementById("messagesList");
      const list = loadMsgs();
      if (!list.length) {
        box.innerHTML = '<div class="msg-card"><div class="msg-body">Xabarlar yo‘q.</div></div>';
        return;
      }
      box.innerHTML = list.map(m => `
        <div class="msg-card">
          <div class="msg-head">
            <span>Bot</span>
            <span class="msg-time">${m.time} • #${m.id}</span>
          </div>
          ${m.replyTo ? `<div class="reply-box"><b>${m.replyTo.sender}</b><br/>${m.replyTo.text}</div>` : ""}
          <div class="msg-body">${m.text}</div>
          <div class="msg-actions">
            ${m.reaction ? `<span class="react-badge">${m.reaction}</span>` : ""}
            <button class="chip" onclick="startReply(${m.id})">Reply</button>
            <button class="chip" onclick="reactMsg(${m.id}, '❤️')">❤️</button>
            <button class="chip" onclick="reactMsg(${m.id}, '👍')">👍</button>
            <button class="chip" onclick="reactMsg(${m.id}, '😂')">😂</button>
            <button class="chip" onclick="startEdit(${m.id})">Tahrir</button>
            <button class="chip" onclick="deleteMsg(${m.id})">O'chir</button>
          </div>
        </div>
      `).join("");
      box.scrollTop = box.scrollHeight;
    }

    function addEmoji(em) {
      const inp = document.getElementById("msgInput");
      inp.value += em;
      inp.focus();
    }

    function startReply(id) {
      const found = loadMsgs().find(x => x.id === id);
      if (!found) return;
      replyTarget = { id: found.id, sender: "Bot", text: found.text };
      document.getElementById("replyText").textContent = `↩️ #${found.id}: ${found.text}`;
      document.getElementById("replyBar").classList.add("active");
    }

    function clearReply() {
      replyTarget = null;
      document.getElementById("replyBar").classList.remove("active");
    }

    function startEdit(id) {
      const found = loadMsgs().find(x => x.id === id);
      if (!found) return;
      editingMsgId = id;
      document.getElementById("msgInput").value = found.text;
      document.getElementById("submitBtn").textContent = "Saqlash";
      document.getElementById("editingBadge").textContent = `Tahrir: #${id}`;
    }

    function cancelEdit() {
      editingMsgId = null;
      document.getElementById("submitBtn").textContent = "Yuborish";
      document.getElementById("editingBadge").textContent = "";
    }

    function reactMsg(id, emoji) {
      const active = getActiveChatObj();
      const list = loadMsgs();
      const item = list.find(x => x.id === id);
      if (!item) return;
      item.reaction = item.reaction === emoji ? "" : emoji;
      saveMsgs(list);
      renderMsgs();
      if (tg) {
        tg.sendData(JSON.stringify({
          action: "react_msg",
          target_id: active.id,
          message_id: id,
          emoji
        }));
      }
    }

    function deleteMsg(id) {
      const active = getActiveChatObj();
      const list = loadMsgs().filter(x => x.id !== id);
      saveMsgs(list);
      renderMsgs();
      if (tg) {
        tg.sendData(JSON.stringify({
          action: "delete_sent_msg",
          target_id: active.id,
          message_id: id
        }));
      }
    }

    function submitMessage() {
      const inp = document.getElementById("msgInput");
      const text = inp.value.trim();
      if (!text) return;
      const active = getActiveChatObj();
      const list = loadMsgs();

      if (editingMsgId !== null) {
        const item = list.find(x => x.id === editingMsgId);
        if (item) {
          item.text = text;
          saveMsgs(list);
          if (tg) {
            tg.sendData(JSON.stringify({
              action: "edit_sent_msg",
              target_id: active.id,
              message_id: editingMsgId,
              text
            }));
          }
        }
        inp.value = "";
        cancelEdit();
        renderMsgs();
        return;
      }

      const newId = Math.floor(Date.now() / 1000) % 100000;
      list.push({
        id: newId,
        sender: "Bot",
        time: nowTime(),
        replyTo: replyTarget ? { sender: "Bot", text: replyTarget.text } : null,
        text,
        reaction: ""
      });
      saveMsgs(list);

      if (tg) {
        tg.sendData(JSON.stringify({
          action: "send_direct",
          target_id: active.id,
          text,
          show_sender: false,
          reply_to_message_id: replyTarget ? replyTarget.id : null
        }));
      }

      inp.value = "";
      clearReply();
      renderMsgs();
    }

    renderChatSelector();
    renderMsgs();
  </script>
</body>
</html>
